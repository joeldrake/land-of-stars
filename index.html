<!doctype html>
<html lang="sv">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#0d0d14" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <link rel="manifest" href="./manifest.webmanifest" />
  <link rel="icon" href="./icon.svg" type="image/svg+xml" />
  <link rel="apple-touch-icon" href="./icon.svg" />
  <title>Stjärnornas land</title>
</head>
<body>
  <div id="app">
    <div id="pad-left" class="pad">
      <div id="dpad" aria-label="D-pad">
        <span class="arm up"></span><span class="arm down"></span>
        <span class="arm left"></span><span class="arm right"></span>
        <span class="hub"></span>
      </div>
    </div>
    <div id="stage">
      <div id="frame">
        <canvas id="screen"></canvas>
        <button id="btn-menu" aria-label="Meny">⚙</button>
        <div id="dialog" hidden>
          <div id="dialog-text"></div>
          <button id="dialog-speak" aria-label="Läs upp">🔊</button>
          <span id="dialog-next">▼</span>
        </div>
      </div>
    </div>
    <div id="pad-right" class="pad">
      <div id="buttons">
        <button id="btn-inv" class="bag" aria-label="Väska">🎒</button>
        <button id="btn-b" class="round b">B</button>
        <button id="btn-a" class="round a">A</button>
      </div>
    </div>
  </div>
  <div id="overlay" hidden></div>
  <script type="module" src="/src/main.ts"></script>
</body>
</html>
